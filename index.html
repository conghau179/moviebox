<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieBox</title>

<style>
body{
    margin:0;
    background:#080808;
    color:white;
    font-family:Arial;
}

header{
    padding:15px;
    background:#151515;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#e50914;
    font-size:24px;
    font-weight:bold;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 15px;
    background:#e50914;
    color:white;
    font-weight:bold;
}

.container{
    padding:20px;
}

.search{
    width:100%;
    padding:14px;
    border:0;
    border-radius:7px;
    background:#222;
    color:white;
    margin-bottom:20px;
}

.movies{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:#151515;
    border-radius:8px;
    overflow:hidden;
}

.card img{
    width:100%;
    height:240px;
    object-fit:cover;
}

.info{
    padding:10px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    padding:20px;
}

.modal-box{
    max-width:600px;
    margin:30px auto;
    background:#181818;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0 15px;
    border:0;
    border-radius:6px;
    background:#292929;
    color:white;
}

video{
    width:100%;
}

.close{
    background:#444;
    margin-top:10px;
}

@media(min-width:600px){
    .movies{
        grid-template-columns:repeat(4,1fr);
    }
}
</style>
</head>

<body>

<header>

<div class="logo">🎬 MovieBox</div>

<button id="addButton">＋ Thêm phim</button>

</header>

<div class="container">

<input
id="search"
class="search"
placeholder="🔎 Tìm kiếm phim..."
>

<div id="movies" class="movies"></div>

</div>


<!-- THÊM PHIM -->

<div id="addModal" class="modal">

<div class="modal-box">

<h2>🎬 Thêm phim</h2>

<input id="name" placeholder="Tên phim">

<input id="poster" placeholder="Link poster">

<input id="video" placeholder="Link video .mp4">

<button id="saveButton">Thêm phim</button>

<button id="closeButton" class="close">Đóng</button>

</div>

</div>


<!-- XEM PHIM -->

<div id="watchModal" class="modal">

<div class="modal-box">

<h2 id="title"></h2>

<video id="player" controls></video>

<button id="watchClose" class="close">Đóng</button>

</div>

</div>


<script>

let movies = [];


const addButton =
document.getElementById("addButton");

const addModal =
document.getElementById("addModal");

const closeButton =
document.getElementById("closeButton");

const saveButton =
document.getElementById("saveButton");

const watchModal =
document.getElementById("watchModal");


addButton.onclick = function(){

    addModal.style.display = "block";

};


closeButton.onclick = function(){

    addModal.style.display = "none";

};


saveButton.onclick = function(){

    let name =
    document.getElementById("name").value;

    let poster =
    document.getElementById("poster").value;

    let video =
    document.getElementById("video").value;


    if(
        name === "" ||
        poster === "" ||
        video === ""
    ){

        alert("Hãy nhập đủ thông tin!");

        return;

    }


    movies.push({

        name:name,Doraemon
        poster:poster,https://youtu.be/dvl2DFoLLAE?si=JWMbRJ9XxM77BVdD
        video:https://youtu.be/dvl2DFoLLAE?si=JWMbRJ9XxM77BVdD

    });


    document.getElementById("name").value = "";
    document.getElementById("poster").value = "";
    document.getElementById("video").value = "";


    addModal.style.display = "none";

    showMovies();

    alert("Đã thêm phim!");

};


function showMovies(){

    let box =
    document.getElementById("movies");

    let search =
    document.getElementById("search")
    .value
    .toLowerCase();


    box.innerHTML = "";


    movies.forEach(function(movie,index){

        if(
            movie.name
            .toLowerCase()
            .includes(search)
        ){

            box.innerHTML += `

            <div class="card">

                <img src="${movie.poster}">

                <div class="info">

                    <b>${movie.name}</b>

                    <br><br>

                    <button onclick="watch(${index})">
                    ▶ Xem phim
                    </button>

                </div>

            </div>

            `;

        }

    });

}


function watch(index){

    let movie = movies[index];

    document.getElementById("title")
    .innerText = movie.name;

    document.getElementById("player")
    .src = movie.video;

    watchModal.style.display = "block";

}


document.getElementById("watchClose").onclick =
function(){

    document.getElementById("player").pause();

    watchModal.style.display = "none";

};


document.getElementById("search").oninput =
showMovies;


</script>

</body>
</html>
