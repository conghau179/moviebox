<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieBox 2.0</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#080808;
color:white;
font-family:Arial,sans-serif
}

header{
background:#111;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:10
}

.logo{
font-size:24px;
font-weight:bold;
color:#e50914
}

button{
border:0;
border-radius:7px;
padding:10px 14px;
background:#e50914;
color:white;
font-weight:bold
}

.container{
max-width:1100px;
margin:auto;
padding:20px
}

.search{
width:100%;
padding:14px;
border:0;
border-radius:8px;
background:#222;
color:white;
font-size:16px;
margin-bottom:20px
}

.movies{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px
}

.card{
background:#151515;
border-radius:10px;
overflow:hidden
}

.card img{
width:100%;
height:250px;
object-fit:cover
}

.info{
padding:12px
}

.title{
font-size:17px;
font-weight:bold;
margin-bottom:10px
}

.card button{
width:100%;
margin-top:5px
}

.delete{
background:#444
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
z-index:20;
padding:20px;
overflow:auto
}

.box{
max-width:650px;
margin:30px auto;
background:#151515;
padding:20px;
border-radius:10px
}

input{
width:100%;
padding:13px;
margin:7px 0 15px;
border:0;
border-radius:7px;
background:#252525;
color:white
}

video{
width:100%;
background:#000
}

.close{
background:#444;
margin-top:12px
}

.empty{
text-align:center;
color:#777;
padding:50px
}

@media(min-width:650px){
.movies{
grid-template-columns:repeat(4,1fr)
}
.card img{
height:280px
}
}
</style>
</head>

<body>

<header>

<div class="logo">🎬 MovieBox</div>

<button onclick="openAdd()">
＋ Thêm phim
</button>

</header>

<div class="container">

<input

id="search"
placeholder="🔎 Tìm kiếm phim..."
oninput="showMovies()"
>

<div id="movies" class="movies"></div>

</div>


<!-- CỬA SỔ THÊM PHIM -->

<div id="addModal" class="modal">

<div class="box">

<h2>🎬 Thêm phim</h2>

<label>Tên phim</label>

<input
id="name"
placeholder="Ví dụ: Doraemon"
>

<label>Link poster</label>

<input
id="poster"
placeholder="https://...jpg"
>

<label>Link video</label>

<input
id="video"
placeholder="https://...mp4"
>

<button onclick="addMovie()">
Thêm phim
</button>

<button class="close" onclick="closeAdd()">
Đóng
</button>

</div>

</div>


<!-- CỬA SỔ XEM PHIM -->

<div id="watchModal" class="modal">

<div class="box">

<h2 id="watchTitle"></h2>

<video id="player" controls></video>

<button class="close" onclick="closeWatch()">
Đóng
</button>

</div>

</div>
